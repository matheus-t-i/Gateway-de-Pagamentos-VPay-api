# Serviços de INFRA local apenas (Postgres + Redis).
# Em PRODUÇÃO: NÃO publicar 5432/6379 na internet — rede privada / VPC,
# Security Group só para a API/Worker, e WAF (Cloudflare ou equivalente)
# na frente do domínio público da API. Ver PRONTIDAO-PRODUCAO.md.
services:
  postgres:
    image: postgres:16-alpine
    container_name: vpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpay
      POSTGRES_PASSWORD: vpay
      POSTGRES_DB: vpay
    ports:
      - "5432:5432"
    volumes:
      - vpay_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpay -d vpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vpay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vpay_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vpay_pg_data:
  vpay_redis_data:
